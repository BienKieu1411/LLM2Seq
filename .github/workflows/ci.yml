name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.9"
    - name: Install Ruff
      # Keep CI formatter output reproducible. Ruff 0.16 changed Markdown
      # code-block formatting, which would otherwise make a clean tree fail
      # when the floating latest version changes.
      run: python -m pip install "ruff==0.15.20"
    - name: Show Ruff version
      run: ruff --version
    - name: Run Ruff Linter
      # Use the repository-level policy explicitly. There are independent
      # package metadata files under src/, so implicit config discovery can
      # otherwise lint the two pipelines with different rule sets.
      run: ruff check . --config pyproject.toml
    - name: Run Ruff Formatter Check
      run: ruff format --check . --config pyproject.toml

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Run oxlint
      uses: oxc-project/oxlint-action@v1
      with:
        working-directory: App/frontend
