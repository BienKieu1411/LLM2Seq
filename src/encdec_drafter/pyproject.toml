[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t5gemma2-encdec-drafter"
version = "0.1.0"
description = "Single-request greedy speculative inference prototype for T5Gemma2"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers==5.14.1",
    "PyYAML>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["encdec_drafter*"]
