_base_: qwen3_enc1_7b_dec0_6b.yaml

experiment:
  name: genbridge_qwen3_mixed_enc1_7b_dec0_6b_overfit_100
  output_dir: runs/genbridge/qwen3_mixed_enc1_7b_dec0_6b_overfit_100

decoder:
  # The short overfit run needs an immediately measurable source signal.
  cross_gate_init: 0.1

training:
  # 125 interface updates followed by 625 full-finetune updates.
  epochs: 30
  interface_warmup_epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 1
  num_workers: 2
  full_lr: 5.0e-5
  log_every_steps: 1

data:
  max_train_samples: 100
  max_validation_samples: 32
  # Evaluate on seen examples: this checks conditioning and ability to overfit,
  # not generalization quality.
  test_file: data/wikilingua/train.jsonl
  max_source_length: 768
  max_target_length: 128
  precompute_evidence_on_load: true

generation:
  batch_size: 2
  max_new_tokens: 128
