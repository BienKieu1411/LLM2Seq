_base_: ../base.yaml

experiment:
  name: lamate_style_postencoder
  output_dir: runs/genbridge/lamate_style

model:
  layer_fusion:
    enabled: true
    indices: [-1, -5, -9, -13]

bridge:
  mode: lamate
  use_salience_loss: false
  use_plan_alignment: false

decoder:
  memory_attention: concat

objectives:
  salience_weight: 0.0
  plan_alignment_weight: 0.0
  plan_diversity_weight: 0.0
