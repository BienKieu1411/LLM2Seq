_base_: base.yaml

experiment:
  name: genbridge_qwen3_0_6b
  output_dir: runs/genbridge/qwen3_0_6b

model:
  encoder_name: Qwen/Qwen3-0.6B

decoder:
  pretrained_name: Qwen/Qwen3-0.6B
  # Qwen3-0.6B has 28 full-attention decoder blocks.
  num_layers: 28

training:
  batch_size: 32
  gradient_accumulation_steps: 1
  optimizer: adamw_torch
  full_lr: 1.0e-5

generation:
  batch_size: 8
