_base_: base.yaml

experiment:
  name: genbridge_qwen3_0_6b_overfit_100
  # A fresh directory prevents evaluation from loading a stale final.pt left
  # by the earlier 8/300-update smoke experiments.
  output_dir: runs/genbridge/qwen3_0_6b_overfit_100

# Replace both values with the same local checkpoint directory when the model
# has already been downloaded. The directory must contain config.json,
# tokenizer files, and model*.safetensors.
model:
  encoder_name: Qwen/Qwen3-0.6B

decoder:
  pretrained_name: Qwen/Qwen3-0.6B
  num_layers: 28
  # The tiny overfit run has far fewer updates than full WikiLingua; expose a
  # measurable source signal immediately so conditioning can be verified.
  cross_gate_init: 0.1

training:
  # Qualitative overfit test: 125 interface updates then 625 full-FT updates.
  # The paper configs remain 2 warm-up + 8 full epochs at effective batch 32.
  epochs: 30
  interface_warmup_epochs: 5
  batch_size: 4
  gradient_accumulation_steps: 1
  num_workers: 2
  full_lr: 5.0e-5
  log_every_steps: 1

data:
  max_train_samples: 100
  max_validation_samples: 32
  # Smoke inference intentionally checks examples seen during this tiny run.
  test_file: data/wikilingua/train.jsonl
  max_source_length: 768
  max_target_length: 128
  precompute_evidence_on_load: true

generation:
  batch_size: 2
  max_new_tokens: 128
