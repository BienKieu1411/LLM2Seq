_base_: base.yaml

experiment:
  name: genbridge_qwen3_1_7b
  output_dir: runs/genbridge/qwen3_1_7b

model:
  encoder_name: Qwen/Qwen3-1.7B

decoder:
  pretrained_name: Qwen/Qwen3-1.7B
  num_layers: 28

training:
  # Effective batch is 32 on one B200.
  batch_size: 8
  gradient_accumulation_steps: 4
  optimizer: adamw_torch
  full_lr: 8.0e-6
  eval_batch_size: 4

generation:
  batch_size: 4
