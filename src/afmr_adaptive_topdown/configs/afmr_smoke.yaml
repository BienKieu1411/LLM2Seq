_base_: afmr_base.yaml

experiment:
  name: afmr_adaptive_topdown_smoke
  output_dir: runs/afmr_adaptive_topdown/smoke

model:
  encoder_name: __tiny__
  decoder_name: __tiny__
  dtype: float32
  gradient_checkpointing: true

architecture:
  name: afmr_value_anchor
  controller_dim: 16
  depth_taps: 2
  depth_rank: 8
  feature_rank: 8
  focus_hidden: 16
  focus_windows: [4, 8, 16]
  contextual_value:
    # Legacy smoke coverage; contextual-value tests opt in with tiny dimensions.
    enabled: false
  adaptive_topdown:
    enabled: false

decoder:
  grounded_copy:
    enabled: false
    key_dim: 8

training:
  interface_warmup_epochs: 1
  full_finetune_epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 1
  validation_batch_size: 2
  num_workers: 0
  validation_num_workers: 0

data:
  decoder_prompt: "Summarize:"
  decoder_chat_template: false
  decoder_prefix: ""
  train_file: tests/fixtures/train.jsonl
  validation_file: tests/fixtures/validation.jsonl
  test_file: tests/fixtures/test.jsonl

generation:
  batch_size: 2
  max_new_tokens: 32
  min_new_tokens: 0
