_base_: base.yaml

experiment:
  name: evibridge_phase12_smoke_100
  output_dir: runs/evibridge/smoke_100

training:
  # Exercise both stage transitions quickly: Phase 1 then Phase 2.
  epochs: 2
  interface_warmup_epochs: 1
  batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 2
  log_every_steps: 1

data:
  max_train_samples: 100
  max_validation_samples: 32
  # Smoke inference intentionally checks examples seen during this tiny run.
  test_file: data/processed/train.jsonl
  precompute_evidence_on_load: true

generation:
  batch_size: 4
  max_new_tokens: 128
