_base_: ../base.yaml

experiment:
  name: evibridge_cnndm
  output_dir: runs/evibridge/cnndm

data:
  train_file: data/cnndm/train.jsonl
  validation_file: data/cnndm/validation.jsonl
  test_file: data/cnndm/test.jsonl
  source_prefix: "Write a concise factual summary covering the main events.\nArticle:\n"
  target_prefix: "\nSummary:\n"
  evidence_unit: sentence
  clean_wikihow_metadata: false
  max_source_length: 3072
  max_target_length: 256
  oracle_max_units: 8
  oracle_budget_mode: target_units
  oracle_rouge1_weight: 0.5
  oracle_rouge2_weight: 0.5

generation:
  max_new_tokens: 192
