_base_: ../base.yaml

experiment:
  name: evibridge_arxiv
  output_dir: runs/evibridge/arxiv

data:
  train_file: data/arxiv/train.jsonl
  validation_file: data/arxiv/validation.jsonl
  test_file: data/arxiv/test.jsonl
  source_prefix: "Summarize the paper's problem, method, evidence, and conclusions without adding claims.\nPaper:\n"
  target_prefix: "\nAbstract:\n"
  evidence_unit: sentence_group
  sentences_per_unit: 3
  clean_wikihow_metadata: false
  max_source_length: 4096
  max_target_length: 512
  oracle_max_units: 16
  oracle_budget_mode: target_units
  oracle_rouge1_weight: 0.6
  oracle_rouge2_weight: 0.4

generation:
  batch_size: 2
  max_new_tokens: 448
