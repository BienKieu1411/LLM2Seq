experiment:
  name: evibridge_qwen35_wikilingua
  kind: encoder_decoder
  output_dir: runs/evibridge/base

model:
  encoder_name: Qwen/Qwen3.5-0.8B
  dtype: bfloat16
  use_lora: false
  train_base: true
  gradient_checkpointing: true
  layer_fusion:
    enabled: false
    indices: [-1, -5, -9, -13]
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules:
      [
        q_proj,
        k_proj,
        v_proj,
        o_proj,
        in_proj_qkv,
        in_proj_z,
        in_proj_b,
        in_proj_a,
        out_proj,
        gate_proj,
        up_proj,
        down_proj,
      ]

bridge:
  # evidence is the proposed model. Other modes exist only for controlled ablations.
  mode: evidence
  hidden_size: 512
  num_layers: 3
  num_heads: 8
  ffn_size: 2048
  num_evidence_slots: 16
  use_evidence_loss: true
  dropout: 0.1

decoder:
  pretrained_name: Qwen/Qwen3.5-0.8B
  # Keep the complete pretrained decoder for the main quality result.
  num_layers: 24
  gradient_checkpointing: true
  cross_attention_dropout: 0.0

objectives:
  evidence_weight: 0.2
  diversity_weight: 0.01

# Optional Phase 3 trains a small speculative draft path after final.pt.
# Every accepted token is still verified by the frozen main decoder.
mtp:
  num_draft_tokens: 4
  ffn_size: 2048
  dropout: 0.05
  draft_head_rank: 128
  distill_weight: 0.8
  supervised_weight: 0.2
  depth_weights: [1.0, 0.8, 0.6, 0.4]
  max_positions_per_sequence: 24
  checkpoint_dtype: bfloat16

phase3:
  epochs: 3
  batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 4
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  fused_optimizer: true
  seed: 42
  log_every_steps: 10

training:
  # Current pilot: epochs 1-3 learn the interface; epochs 4-7 full-FT.
  epochs: 7
  interface_warmup_epochs: 3
  skip_interface_warmup_on_resume: true
  batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 4
  encoder_lr: 8.0e-6
  decoder_lr: 1.0e-5
  bridge_lr: 1.0e-4
  interface_lr: 1.0e-4
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  fused_optimizer: true
  seed: 42
  log_every_steps: 10

data:
  train_file: data/processed/train.jsonl
  validation_file: data/processed/validation.jsonl
  test_file: data/processed/test.jsonl
  source_prefix: "Tóm tắt thành các bước hành động ngắn, đúng thứ tự; không thêm thông tin.\nVăn bản:\n"
  target_prefix: "\nCác bước:\n"
  # Dataset profile: the model pools configurable evidence units, not WikiHow-only steps.
  evidence_unit: sentence
  sentence_separator: "\n"
  use_chat_template: true
  clean_wikihow_metadata: true
  max_source_length: 3072
  max_target_length: 384
  oracle_max_units: 12
  oracle_budget_mode: target_units
  oracle_fixed_units: 3
  oracle_rouge1_weight: 0.5
  oracle_rouge2_weight: 0.5
  # Compute the oracle once before training; avoids repeating CPU ROUGE search every epoch.
  precompute_evidence_on_load: true

generation:
  batch_size: 32
  min_new_tokens: 16
  max_new_tokens: 256
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3
  mtp_fallback_probe_steps: 8
  mtp_fallback_min_accepted_drafts: 1.0
