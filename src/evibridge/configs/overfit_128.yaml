_base_: base.yaml

experiment:
  name: evibridge_overfit_128
  output_dir: runs/overfit_128

decoder:
  num_layers: 8

bridge:
  hidden_size: 256
  num_layers: 2
  num_heads: 4
  ffn_size: 1024
  num_evidence_slots: 8

training:
  epochs: 30
  interface_warmup_epochs: 2
  batch_size: 8
  gradient_accumulation_steps: 1
  num_workers: 2
  log_every_steps: 10

data:
  # Evaluating this config intentionally reads the first training examples.
  test_file: data/processed/train.jsonl
  max_train_samples: 128
  max_validation_samples: 16
  max_source_length: 768
  max_target_length: 128
  precompute_evidence_on_load: false

generation:
  batch_size: 2
  max_new_tokens: 128
