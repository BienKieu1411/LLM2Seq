experiment:
  name: llm2seq_v2_qwen3_0_6b
  output_dir: runs/llm2seq_v2/qwen3_embedding_0_6b_to_qwen3_0_6b

model:
  # Encoder and decoder intentionally use separate tokenizers/checkpoints.
  encoder_name: Qwen/Qwen3-Embedding-0.6B
  decoder_name: Qwen/Qwen3-0.6B
  encoder_hidden_size: 1024
  decoder_hidden_size: 1024
  # FP32 master weights + BF16 autocast preserve small full-FT updates.
  dtype: float32
  gradient_checkpointing: true

adapter:
  # Preserve the original LLM2Seq path: hidden-layer fusion followed by a
  # bidirectional token adapter. No planner or compressed memory is introduced.
  layer_fusion: true
  fuse_layers: [-1, -5, -9, -13]
  hidden_size: 1024
  projection_ffn_size: 2048
  projection_gate_init: 0.10
  num_bidirectional_layers: 4
  num_heads: 16
  ffn_size: 4096
  rope_theta: 1000000.0
  bidirectional_gate_init: 0.10
  dropout: 0.10
  # Salience is an auxiliary soft logit bias over full token memory. It never
  # removes or compresses source tokens.
  use_salience: true
  salience_hidden_size: 512
  salience_gate_init: 0.10
  salience_bias_scale: 0.50

decoder:
  # Conventional encoder-decoder cross-attention, as in LLM2Seq v1, is placed
  # after native self-attention in every Qwen block.
  cross_attention_every: 1
  initialize_cross_from_self: true
  cross_gate_init: 0.10
  cross_attention_dropout: 0.0

objectives:
  salience_weight: 0.10

training:
  # Phase 1 freezes both pretrained backbones and learns only adapter/cross
  # attention. Phase 2 full-fine-tunes every encoder/adapter/decoder parameter.
  interface_warmup_epochs: 3
  full_finetune_epochs: 12
  batch_size: 64
  gradient_accumulation_steps: 1
  num_workers: 4
  validation_batch_size: 64
  validation_num_workers: 2
  # No validation checkpoint selection; 0 disables intermediate validation.
  validation_every_epochs: 0
  warmup_adapter_lr: 1.0e-4
  warmup_cross_attention_lr: 1.0e-4
  full_encoder_lr: 8.0e-6
  full_decoder_lr: 1.0e-5
  full_adapter_lr: 3.0e-5
  full_cross_attention_lr: 5.0e-5
  warmup_ratio: 0.05
  min_lr_ratio: 0.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  fused_optimizer: true
  seed: 42
  log_every_steps: 10

data:
  train_file: data/wikilingua/train.jsonl
  validation_file: data/wikilingua/validation.jsonl
  test_file: data/wikilingua/test.jsonl
  source_prefix: "Nhiệm vụ: Tóm tắt văn bản thành các bước ngắn, đúng thứ tự.\nVăn bản:\n"
  sentence_separator: "\n"
  decoder_instruction: "Hãy tóm tắt văn bản đã mã hóa thành các bước hành động ngắn, đúng thứ tự và không thêm thông tin."
  decoder_prefix: "Các bước:\n"
  use_decoder_chat_template: true
  enable_thinking: false
  clean_wikihow_metadata: true
  max_source_length: 3072
  max_target_length: 384
  oracle_max_units: 12
  precompute_evidence: true
  precompute_validation_evidence: false

generation:
  batch_size: 64
  min_new_tokens: 16
  max_new_tokens: 256
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3

checkpoint:
  save_best: false
  save_each_epoch: false
  save_last: true

benchmark:
  name: T5Gemma2-1B-1B-full
  rouge1: 39.3040
  rouge2: 19.5308
  rougeL: 39.2955

limits:
  max_train_examples: 0
  max_validation_examples: 0
  max_test_examples: 0
