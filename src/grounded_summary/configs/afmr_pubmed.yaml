_base_: afmr_base.yaml

experiment:
  name: grounded_summary_pubmed_key256
  output_dir: runs/grounded_summary/pubmed_key256_copy

data:
  train_file: datasets/pubmed/train.jsonl
  validation_file: datasets/pubmed/validation.jsonl
  test_file: datasets/pubmed/test.jsonl
  encoder_prefix: "Summarize the following biomedical research article into a concise, factual abstract. Preserve the key objective, methods, results, and conclusion; do not add information.\nArticle:\n"
  decoder_prompt: "Write a concise biomedical abstract from the encoded article. Include objective, methods, key results, and conclusion when supported. Preserve terms, entities, numbers, units, negation, and result direction. Output only supported information."
  decoder_prefix: "Abstract:\n"
  detokenize: true

architecture:
  name: afmr_value_anchor
  controller_dim: 384
  depth_taps: 4
  depth_rank: 256
  depth_gate_init: 0.04
  depth_gate_max: 0.15
  feature_rank: 512
  feature_gate_init: 0.04
  feature_gate_max: 0.20
  focus_hidden: 384
  focus_windows: [32, 128, 512, 1024]
  focus_overlap: 0.5
  focus_strength_init: 0.10
  focus_strength_max: 0.50
  temperature_init: 1.0
  temperature_min: 0.75
  temperature_max: 1.5
  region_router:
    enabled: true
    window_size: 128
    rank: 64
    gate_max: 0.05
    temperature: 1.0
    start_fraction: 0.75

decoder:
  grounded_copy:
    key_dim: 256
    alpha_max: 0.20
    generate_reserve: 0.05

generation:
  max_new_tokens: 512
  min_new_tokens: 32
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3

model:
  encoder_name: /absolute/path/to/pplx-embed-v1-0.6b
  decoder_name: /absolute/path/to/Qwen3-0.6B

training:
  interface_warmup_epochs: 0
  full_finetune_epochs: 4
  batch_size: 84
  gradient_accumulation_steps: 1
  max_grad_norm: 2.0
  save_best: false
