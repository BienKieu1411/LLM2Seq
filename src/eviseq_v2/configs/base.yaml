experiment:
  name: eviseq_qwen3_evidence
  output_dir: runs/eviseq/qwen3_evidence

task:
  format: text_to_text
  metrics: [rouge]
  metric_callable: ""

model:
  encoder_name: Qwen/Qwen3-Embedding-0.6B
  decoder_name: Qwen/Qwen3-0.6B
  encoder_hidden_size: 1024
  decoder_hidden_size: 1024
  dtype: float32
  gradient_checkpointing: true
  encoder_attn_implementation: sdpa
  encoder_trust_remote_code: true

native_attention:
  backend: qwen_native
  variant: evidence
  implementation_revision: selective_evidence_v2
  bidirectional_layer_count: 6
  evidence_key_bias_scale: 1.0
  evidence_view_gate_init: 0.01

bridge:
  salience_hidden_size: 512
  # Off by default.  For encoder/decoder pairs with the same hidden width,
  # enable this to learn an identity-initialized residual PPLX-space ->
  # Qwen-space correction without perturbing the pretrained memory at step 0.
  trainable_identity_projection: false
  # ``signed_tanh`` preserves legacy checkpoints.  New sentence-evidence
  # recipes explicitly select ``sigmoid`` so positive salience can never
  # reverse the decoder's cross-attention preference.
  salience_gate_parameterization: signed_tanh
  # Preserve pre-correction checkpoints.  New bridge recipes use
  # ``unit_invariant`` so a small evidence gate cannot favour long units.
  salience_length_normalization: legacy_gated
  salience_gate_init: 0.10
  salience_bias_scale: 1.00
  salience_ranking_weight: 0.25
  dropout: 0.10

decoder:
  cross_attention_every: 1
  initialize_cross_from_self: true
  cross_gate_init: 0.10
  cross_attention_dropout: 0.0
  memory_bank_count: 1

objectives:
  salience_weight: 0.10
  use_contrastive: false
  contrastive_weight: 0.0
  contrastive_across_accumulation: false
  use_evidence_contrastive: true
  evidence_contrastive_weight: 0.10
  evidence_contrastive_temperature: 0.07
  evidence_contrastive_projection_size: 256
  evidence_hard_negatives: 4
  # Use a gentle set while the copied cross-attention is warming up.  A task
  # recipe may raise this for full fine-tuning once evidence keys are useful.
  evidence_hard_negatives_full: 4
  evidence_hard_negative_salience_boost: 0.10
  # ``document`` is the legacy whole-summary objective.  Task recipes can
  # select a target-free prompt-conditioned evidence query instead.
  evidence_contrastive_mode: document
  evidence_contrastive_salience_bias: 0.0
  evidence_contrastive_warmup_epochs: 1

training:
  interface_warmup_epochs: 2
  full_finetune_epochs: 10
  batch_size: 32
  gradient_accumulation_steps: 4
  num_workers: 4
  validation_batch_size: 16
  validation_num_workers: 2
  validation_every_epochs: 0
  warmup_adapter_lr: 1.0e-4
  warmup_cross_attention_lr: 1.0e-4
  full_encoder_lr: 1.0e-5
  full_decoder_lr: 1.0e-5
  full_adapter_lr: 3.0e-5
  full_cross_attention_lr: 5.0e-5
  warmup_ratio: 0.05
  min_lr_ratio: 0.0
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  fused_optimizer: true
  seed: 42
  log_every_steps: 10
  init_checkpoint: ""
  strict_initial_checkpoint: true

data:
  train_file: datasets/wikilingua/train.jsonl
  validation_file: datasets/wikilingua/validation.jsonl
  test_file: datasets/wikilingua/test.jsonl
  source_field: source
  target_field: target
  id_field: id
  list_separator: "\n"
  source_template: ""
  target_template: ""
  record_mapper: ""
  source_prefix: "Tóm tắt thành các bước hành động ngắn, đúng thứ tự; không thêm thông tin.\nVăn bản:\n"
  sentence_separator: "\n"
  decoder_instruction: "Hãy tóm tắt văn bản đã mã hóa thành các bước hành động ngắn, đúng thứ tự và không thêm thông tin."
  decoder_prefix: "Các bước:\n"
  use_decoder_chat_template: true
  enable_thinking: false
  clean_wikihow_metadata: true
  max_source_length: 3072
  max_target_length: 384
  oracle_max_units: 12
  sentence_evidence_supervision: false
  sentence_evidence_max_units: 1
  sentence_evidence_use_union_as_salience: false
  precompute_evidence: true
  precompute_validation_evidence: false
  supervise_evidence: true

generation:
  batch_size: 64
  min_new_tokens: 16
  max_new_tokens: 256
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3

checkpoint:
  save_best: true
  save_each_epoch: true
  best_metric: eval_loss_ce
  best_mode: min
  save_last: true

benchmark:
  diagnostic:
    backend: rouge==1.0.0
    rouge1: 39.3040
    rouge2: 19.5308
    rougeL: 39.2955
  paper:
    name: T5Gemma2-1B-1B-full
    model_id: google/t5gemma-2-1b-1b
    backend: Perl ROUGE-1.5.5 via pyrouge
    score_tolerance: 0.02
    rouge1: 62.013
    rouge2: 32.654
    rougeL: 58.143
    num_examples: 3901

reporting:
  parameter_efficiency_claim_eligible: true
  target_total_footprint_approx: 1700000000

limits:
  max_train_examples: 0
  max_validation_examples: 0
  max_test_examples: 0
