_base_: ../pubmed.yaml

experiment:
  name: eviseq_pubmed_pplx_0_6b_to_qwen3_0_6b
  output_dir: runs/eviseq_v2/pubmed_pplx_0_6b

model:
  encoder_name: perplexity-ai/pplx-embed-v1-0.6b
  encoder_hidden_size: 1024
  encoder_attn_implementation: sdpa
  encoder_trust_remote_code: true
  encoder_revision: 2c4d510dd4a732063c31a0f70193e35067b51fd8

native_attention:
  _replace_: true
  backend: pretrained_native
  variant: pretrained

objectives:
  contrastive_pooling: mean

# PPLX-Embed consumes the article directly; the decoder retains the PubMed
# summarization instruction inherited from pubmed.yaml.
data:
  source_prefix: ""

ranking:
  candidates_file: runs/eviseq_v2/pubmed_pplx_0_6b/ranking/candidates.jsonl
