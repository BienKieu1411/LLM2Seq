_base_: base.yaml

experiment:
  name: eviseq_pubmed_qwen3_evidence
  output_dir: runs/eviseq/pubmed_qwen3_evidence

training:
  interface_warmup_epochs: 2
  full_finetune_epochs: 6
  # B200 profile: keep the 96-example InfoNCE batch physical. With accum=1,
  # EviSeq now skips the otherwise redundant two-pass GradCache forward.
  batch_size: 96
  gradient_accumulation_steps: 1
  length_bucketing: true
  length_bucket_multiplier: 50
  num_workers: 8
  validation_batch_size: 2

data:
  train_file: eviseq/data/pubmed/train.jsonl
  validation_file: eviseq/data/pubmed/validation.jsonl
  test_file: eviseq/data/pubmed/test.jsonl
  source_prefix: "Summarize the following biomedical research article into a concise, factual abstract. Preserve the key objective, methods, results, and conclusion; do not add information.\nArticle:\n"
  decoder_instruction: "Write a concise, factual abstract of the encoded biomedical article. Preserve the key objective, methods, results, and conclusion; do not add information."
  decoder_prefix: "Abstract:\n"
  clean_wikihow_metadata: false
  max_source_length: 4096
  max_target_length: 512
  oracle_max_units: 12
  # PubMed has ~120k long documents. Avoid the silent, single-threaded
  # full-corpus oracle pass; DataLoader workers compute identical labels lazily.
  precompute_evidence: false

generation:
  batch_size: 2
  min_new_tokens: 32
  max_new_tokens: 512

# Preserve the same official PubMed splits used by the T5Gemma baseline.
# Exact overlaps remain counted in the audit artifact, but do not abort the run.
data_integrity:
  fail_on_cross_split: false

benchmark:
  _replace_: true
  paper:
    name: T5Gemma2-1B-1B-full-PubMed
    model_id: google/t5gemma-2-1b-1b
    backend: Perl ROUGE-1.5.5 via pyrouge
    status: pending_baseline_artifact
