_base_: base.yaml

experiment:
  name: eviseq_cnndm_qwen3_evidence
  output_dir: runs/eviseq/cnndm_qwen3_evidence

training:
  interface_warmup_epochs: 2
  full_finetune_epochs: 4
  batch_size: 32
  gradient_accumulation_steps: 4
  validation_batch_size: 4

data:
  train_file: eviseq/data/cnndm/train.jsonl
  validation_file: eviseq/data/cnndm/validation.jsonl
  test_file: eviseq/data/cnndm/test.jsonl
  source_prefix: "Summarize the following news article concisely. Preserve the important facts and do not add information.\nArticle:\n"
  decoder_instruction: "Summarize the encoded news article concisely. Preserve the important facts and do not add information."
  decoder_prefix: "Summary:\n"
  clean_wikihow_metadata: false
  max_source_length: 4096
  max_target_length: 256
  oracle_max_units: 8

generation:
  batch_size: 4
  min_new_tokens: 8
  max_new_tokens: 192

benchmark:
  _replace_: true
  paper:
    name: T5Gemma2-1B-1B-full-CNN-DailyMail
    model_id: google/t5gemma-2-1b-1b
    backend: Perl ROUGE-1.5.5 via pyrouge
    score_tolerance: 0.02
    rouge1: 43.591
    rouge2: 19.396
    rougeL: 40.436
