_base_: pplx_pubmed.yaml

# Main PubMed architecture experiment.  PPLX stays the single pretrained
# bidirectional encoder; Qwen stays the single pretrained causal decoder.
# The additional supervision exists only during training and is discarded at
# inference, which remains one encoder -> evidence bridge -> one decoder.
experiment:
  name: eviseq_pubmed_pplx_aligned_0_6b_to_qwen3_0_6b
  output_dir: runs/eviseq/pubmed_pplx_aligned_0_6b

objectives:
  evidence_contrastive_mode: sentence_aligned
  # Direct, differentiable coupling between sentence evidence quality and the
  # salience logits that form the decoder cross-attention bias.
  evidence_contrastive_salience_bias: 0.15
  # Four negatives are stable while the bridge warms up; full fine-tuning
  # contrasts against the eight most confusable non-evidence sentences.
  evidence_hard_negatives: 4
  evidence_hard_negatives_full: 8
  evidence_contrastive_weight: 0.10

training:
  interface_warmup_epochs: 1
  # 1 warm-up + 3 full passes: exactly the four data passes of T5Gemma.
  full_finetune_epochs: 3
  # Match the optimizer-update regime of the 1B--1B T5Gemma baseline instead
  # of hiding a four-times smaller full-finetuning budget behind batch=96.
  batch_size: 32
  gradient_accumulation_steps: 1

data:
  # Match the published T5Gemma PubMed baseline's source serialization and
  # 4,096-token budget.  The decoder keeps the corresponding instruction.
  source_prefix: "Summarize the following biomedical research article into a concise, factual abstract. Preserve the key objective, methods, results, and conclusion; do not add information.\nArticle:\n"
  sentence_evidence_supervision: true
  # Use the union of sentence-level oracle evidence for the global bridge
  # score, preventing conflicting "positive here, negative there" updates.
  sentence_evidence_use_union_as_salience: true
  # A PubMed abstract claim can require objective/method/result evidence from
  # three complementary source sentences.  Keep this bounded so the positive
  # set remains selective rather than becoming a broad extractive label.
  sentence_evidence_max_units: 3
