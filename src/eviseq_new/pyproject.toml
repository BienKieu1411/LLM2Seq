[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eviseq"
version = "0.1.0"
description = "Build a text-to-text encoder-decoder from pretrained LLM components"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=5.2,<6",
  "accelerate>=1.2",
  "safetensors>=0.4",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "rouge==1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
eviseq = "eviseq.cli:main"

[tool.setuptools]
packages = [
  "eviseq",
  "eviseq.data",
  "eviseq.evaluation",
  "eviseq.modeling",
  "eviseq.training",
]
package-dir = {eviseq = "core"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
