_base_: afmr_base.yaml

experiment:
  name: afmr_summary_wikilingua
  output_dir: runs/afmr/summary_wikilingua

# This file is a recipe template. The two-stage runner materializes the
# dataset paths and epoch counts for each stage.
data:
  train_file: datasets/90k/train.jsonl
  validation_file: datasets/wikilingua/validation.jsonl
  test_file: datasets/wikilingua/test.jsonl
  source_field: text
  target_field: summary
  id_field: id
  encoder_prefix: "Hãy đọc văn bản nguồn và viết một bản tóm tắt ngắn gọn, chính xác, mạch lạc. Chỉ giữ các thông tin quan trọng; không thêm thông tin không có trong văn bản nguồn.\n\nVăn bản nguồn:\n"
  decoder_prompt: "Viết bản tóm tắt ngắn gọn và chính xác từ văn bản nguồn. Chỉ sử dụng thông tin trong nguồn, không thêm thông tin mới. Chỉ trả về bản tóm tắt."
  decoder_chat_template: true
  decoder_prefix: "Tóm tắt:\n"
  detokenize: true
  max_source_length: 3072
  max_target_length: 512

generation:
  batch_size: 4
  max_new_tokens: 512
  min_new_tokens: 16
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3
  num_beams: 1
  do_sample: false
  temperature: 0.0
  top_k: 0
  top_p: 1.0

model:
  encoder_name: /absolute/path/to/pplx-embed-v1-0.6b
  decoder_name: /absolute/path/to/Qwen3-0.6B

training:
  interface_warmup_epochs: 0
  full_finetune_epochs: 4
  save_best: false
  save_each_epoch: true
  resume_checkpoint: ""
  resume_scheduler: false
