_base_: pplx_pubmed_aligned_bridgeproj_gate20.yaml

# Phase 3 only.  It must be initialized from this recipe's completed `last.pt`.
# The 4B Qwen teacher is used online during training and is never serialized
# with EviSeq or used when generating final summaries.
experiment:
  name: eviseq_pubmed_pplx_aligned_bridgeproj_gate20_kd_0_6b_to_qwen3_0_6b
  output_dir: runs/eviseq/pubmed_pplx_aligned_bridgeproj_gate20_kd_0_6b

online_kd:
  enabled: true
  epochs: 1
  weight: 0.10
  temperature: 2.0
  topk: 32
  # Teacher's full-vocabulary forward is microbatched independently of the
  # student batch to bound VRAM.  It does not alter the KD objective.
  teacher_batch_size: 4
  # Set this to the already downloaded *local* Qwen3-4B folder on the server.
  # A Hub repo ID is rejected so the phase cannot trigger a download.
  teacher_model: ""
  teacher_device: cuda:1
  teacher_max_input_length: 4096
  encoder_lr: 5.0e-6
  decoder_lr: 5.0e-6
  adapter_lr: 1.0e-5
  cross_attention_lr: 1.0e-5
