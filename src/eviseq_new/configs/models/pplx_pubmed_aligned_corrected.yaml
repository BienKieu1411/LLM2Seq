_base_: pplx_pubmed_aligned.yaml

# Do not overwrite the historical aligned result: this is the corrected,
# checkpoint-incompatible reference run for the two architecture variants.
# It changes only the run identity/output directory; all model, data,
# objective, schedule, and greedy-generation settings are inherited exactly.
experiment:
  name: eviseq_pubmed_pplx_aligned_corrected_0_6b_to_qwen3_0_6b
  output_dir: runs/eviseq/pubmed_pplx_aligned_corrected_0_6b

bridge:
  # Correct the prior at the evidence-bridge boundary.  Positive source-unit
  # logits can be amplified but never inverted by a learned scalar, and
  # equal-logit source units keep equal total attention mass irrespective of
  # their number of subword tokens.
  salience_gate_parameterization: sigmoid
  salience_length_normalization: unit_invariant
