_base_: ../base.yaml

experiment:
  name: my_translation_task
  output_dir: runs/eviseq/my_translation_task

task:
  format: text_to_text
  # Replace or extend with task.metric_callable for COMET, BLEU, chrF, etc.
  metrics: [exact_match, token_f1]

objectives:
  salience_weight: 0.0
  use_contrastive: false
  contrastive_weight: 0.0
  contrastive_across_accumulation: false
  use_evidence_contrastive: false
  evidence_contrastive_weight: 0.0

training:
  interface_warmup_epochs: 1
  full_finetune_epochs: 3

data:
  train_file: /absolute/path/to/train.jsonl
  validation_file: /absolute/path/to/validation.jsonl
  test_file: /absolute/path/to/test.jsonl
  # Example: {"uid":"1","source_text":"Hello","target_text":"Xin chào"}
  id_field: uid
  source_field: source_text
  target_field: target_text
  source_prefix: "Translate the input faithfully into the requested target language.\nInput:\n"
  decoder_instruction: "Return only the translation of the encoded input."
  decoder_prefix: ""
  clean_wikihow_metadata: false
  max_source_length: 2048
  max_target_length: 512
  supervise_evidence: false
  precompute_evidence: false
  precompute_validation_evidence: false

generation:
  batch_size: 16
  min_new_tokens: 1
  max_new_tokens: 512
  repetition_penalty: 1.0
  no_repeat_ngram_size: 0

benchmark:
  _replace_: true
