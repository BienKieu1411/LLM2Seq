_base_: afmr_base.yaml

experiment:
  name: afmr_wikilingua
  output_dir: runs/afmr/wikilingua

data:
  train_file: datasets/wikilingua/train.jsonl
  validation_file: datasets/wikilingua/validation.jsonl
  test_file: datasets/wikilingua/test.jsonl
  encoder_prefix: "Summarize the text faithfully and concisely.\nText:\n"
  decoder_prompt: "Summarize the text faithfully and concisely.\nSummary:\n"
  max_source_length: 3072
  max_target_length: 384

model:
  encoder_name: /absolute/path/to/pplx-embed-v1-0.6b
  decoder_name: /absolute/path/to/Qwen3-0.6B
