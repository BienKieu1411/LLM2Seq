_base_: qwen3_embedding_0_6b_psb.yaml

experiment:
  name: llm2seq_v4_cnndm_qwen3_embedding_0_6b_psb_4096
  output_dir: runs/llm2seq_v4/cnndm_qwen3_embedding_0_6b_psb_4096

# Exactly six epochs: one frozen-backbone interface warm-up and five epochs of
# full-parameter fine-tuning on the much larger CNN/DailyMail training split.
training:
  interface_warmup_epochs: 1
  full_finetune_epochs: 5
  batch_size: 32
  gradient_accumulation_steps: 1
  validation_batch_size: 16
  validation_max_examples: 512
  warmup_ratio: 0.05

objectives:
  contrastive_warmup_epochs: 1
  plan_only_anneal_epochs: 2.0
  oracle_evidence_anneal_epochs: 2.0

data:
  train_file: data/cnndm/train.jsonl
  validation_file: data/cnndm/validation.jsonl
  test_file: data/cnndm/test.jsonl
  source_prefix: "Summarize the following news article concisely. Preserve the important facts and do not add information.\nArticle:\n"
  decoder_instruction: "Summarize the encoded news article concisely. Preserve the important facts and do not add information."
  decoder_prefix: "Summary:\n"
  clean_wikihow_metadata: false
  max_source_length: 4096
  max_target_length: 256
  oracle_max_units: 8
  subset_strategy: head
  subset_seed: 42

generation:
  batch_size: 16
  min_new_tokens: 8
  max_new_tokens: 192
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3

# Never inherit WikiLingua fingerprints or score targets into CNN/DailyMail.
# Exact CNN/DailyMail count/hash locking happens after local data preparation.
benchmark:
  _replace_: true
  parameters:
    target_name: T5Gemma2-1B-1B
    target_declared_parameters: 2000000000
    target_is_rounded: true
    target_source: https://huggingface.co/google/t5gemma-2-1b-1b
  reference_only:
    name: T5Gemma2-1B-1B-full-CNN-DailyMail
    backend: Perl ROUGE-1.5.5 via pyrouge
    rouge1: 43.591
    rouge2: 19.396
    rougeL: 40.436
    comparability: pending_exact_test_count_and_fingerprint
