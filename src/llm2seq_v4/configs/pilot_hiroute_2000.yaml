_base_: qwen3_0_6b_hiroute.yaml

experiment:
  name: llm2seq_v4_pilot_hiroute_2000
  output_dir: runs/llm2seq_v4/pilot_hiroute_2000

training:
  interface_warmup_epochs: 2
  full_finetune_epochs: 4
  batch_size: 64
  gradient_accumulation_steps: 1
  validation_batch_size: 64
  validation_every_epochs: 1
  validation_max_examples: 256

generation:
  batch_size: 64

limits:
  # Train/validation/test remain disjoint official splits. Unlike smoke, this
  # pilot measures generalization and uses the main physical InfoNCE batch.
  max_train_examples: 2000
  max_validation_examples: 512
  max_test_examples: 512
