_base_: qwen3_embedding_0_6b_psb.yaml

experiment:
  name: llm2seq_v4_pubmed_qwen3_embedding_0_6b_psb_4096
  output_dir: runs/llm2seq_v4/pubmed_qwen3_embedding_0_6b_psb_4096

# PubMed is a large long-document corpus. Warm the newly installed interface
# for two epochs, then update all parameters for six epochs.
training:
  interface_warmup_epochs: 2
  full_finetune_epochs: 6
  batch_size: 16
  gradient_accumulation_steps: 2
  validation_batch_size: 8
  validation_max_examples: 512
  warmup_ratio: 0.05

objectives:
  contrastive_warmup_epochs: 2
  plan_only_anneal_epochs: 2.0
  oracle_evidence_anneal_epochs: 2.0

data:
  train_file: data/pubmed/train.jsonl
  validation_file: data/pubmed/validation.jsonl
  test_file: data/pubmed/test.jsonl
  source_prefix: "Summarize the following biomedical research article into a concise, factual abstract. Preserve the key objective, methods, results, and conclusion; do not add information.\nArticle:\n"
  decoder_instruction: "Write a concise, factual abstract of the encoded biomedical article. Preserve the key objective, methods, results, and conclusion; do not add information."
  decoder_prefix: "Abstract:\n"
  clean_wikihow_metadata: false
  max_source_length: 4096
  max_target_length: 512
  oracle_max_units: 12
  subset_strategy: head
  subset_seed: 42

generation:
  batch_size: 8
  min_new_tokens: 32
  max_new_tokens: 512
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3

# PubMed scores are locked only after every model uses the same converted test
# file and its canonical fingerprint has been recorded.
benchmark:
  _replace_: true
  parameters:
    target_name: T5Gemma2-1B-1B
    target_declared_parameters: 2000000000
    target_is_rounded: true
    target_source: https://huggingface.co/google/t5gemma-2-1b-1b
