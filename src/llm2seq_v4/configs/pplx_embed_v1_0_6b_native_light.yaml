_base_: pplx_embed_v1_0_6b_hiroute.yaml

experiment:
  name: llm2seq_v4_pplx_embed_v1_0_6b_native_light
  output_dir: runs/llm2seq_v4/pplx_embed_v1_0_6b_native_light

adapter:
  # PPLX is already globally bidirectional. Keep layer fusion, sentence
  # context, salience, and two task-refinement blocks, but remove the three
  # full-length banks. This is the efficiency/overfitting decision control.
  num_bidirectional_layers: 2
  depth_routed_memory: false
  branch_global_context: false

decoder:
  memory_bank_count: 1
  query_adaptive_routing: false

objectives:
  routing_balance_weight: 0.0
