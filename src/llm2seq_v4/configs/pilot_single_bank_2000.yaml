_base_: qwen3_0_6b.yaml

experiment:
  name: llm2seq_v4_pilot_single_bank_2000
  output_dir: runs/llm2seq_v4/pilot_single_bank_2000

adapter:
  # Match main capacity/context; remove only the additional memory banks and
  # router so the pilot isolates HiRoute rather than adapter depth.
  num_bidirectional_layers: 8
  hierarchical_sentence_context: true
  sentence_context_size: 256
  sentence_context_heads: 8
  sentence_context_ffn_size: 1024
  sentence_context_layers: 2
  sentence_broadcast_gate_init: 0.10

training:
  interface_warmup_epochs: 2
  full_finetune_epochs: 4
  batch_size: 64
  gradient_accumulation_steps: 1
  validation_batch_size: 64
  validation_every_epochs: 1
  validation_max_examples: 256

generation:
  batch_size: 64

limits:
  max_train_examples: 2000
  max_validation_examples: 512
  max_test_examples: 512
