[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afmr-core"
version = "0.1.0"
description = "AFMR value-anchor dual-readout summarization model"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
  "torch>=2.1",
  "transformers>=4.45",
  "rouge==1.0.0",
]

[project.scripts]
afmr-core = "afmr_core.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["afmr_core"]
