# Paths are relative to THIS config, or use absolute server paths.
base_config: ../../../src/eviseq_new/runs/afmr/train/resolved_config.yaml
sft_checkpoint: ../../../src/eviseq_new/runs/afmr/train/epoch_004.pt
output_dir: ../../../runs/seam_grpo/rouge_ce
# Optional: override only train / validation paths. Prompts and model paths are
# inherited from base_config. No test data is read during training.
train_file: /workspace/storage-shared/nlp/dungdx4/bien_projects/LLM2Seq/src/eviseq_new/datasets/grpo_rouge/train.jsonl
validation_file: /workspace/storage-shared/nlp/dungdx4/bien_projects/LLM2Seq/src/eviseq_new/datasets/grpo_rouge/validation.jsonl

training:
  rollout_backend: seam_vllm       # native remains available without vLLM
  vllm_mode: dedicated             # one training GPU + one automatically started rollout GPU
  vllm_rollout_gpu: "1"            # physical GPU index/UUID, outside the trainer's CUDA_VISIBLE_DEVICES
  vllm_server_timeout: 1800
  vllm_gpu_memory_utilization: 0.80 # dedicated B200 host; KV cache for 256 concurrent sequences, headroom for encoder/bridge and FP32 receive buffers
  vllm_max_num_seqs: 256          # all 32 sources x group_size 8 candidates decode concurrently; group_size is unchanged
  vllm_max_num_batched_tokens: 65536 # scheduler capacity: prefill of many long sources + 256 decode tokens per step
  vllm_encoder_max_batch_tokens: 32768 # encoder microbatch budget; source token cap is unchanged
  vllm_logp_mean_tolerance: 0.10   # per-microbatch mean |logp diff|; normal BF16 is ~0.02, heavy-tail microbatches reach ~0.05; real bugs give >0.3
  vllm_logp_max_tolerance: 1.00    # warn on isolated outliers; mean/nonfinite errors still stop all ranks
  vllm_importance_sampling_clip_max: 2.0 # token-level TIS for train/inference numerical mismatch
  vllm_group_sampling: true        # encode each source once with SamplingParams(n=group_size)
  epochs: 1
  prompt_batch_size: 8             # unique sources per training microbatch
  group_size: 8                   # sampled summaries per source
  gradient_accumulation_steps: 4   # unchanged: 32 sources / 256 candidates per dedicated update
  rollout_micro_batch_size: 8     # native rollout only; vLLM uses max_num_seqs
  score_micro_batch_size: 8       # score one complete candidate group; gold CE remains once per source
  logprob_chunk_size: 64          # fewer vocabulary-projection/checkpoint launches, with more activation memory
  max_new_tokens: 1024            # explicit output cap for GRPO rollout and validation
  temperature: 1.0                # also used in policy likelihoods
  epsilon: 0.2
  scale_rewards: none             # group centering, no std division (Dr. GRPO)
  ce_weight: 0.05                 # hypothesis; tune on validation
  beta: 0.0                      # >0 loads a separate frozen SFT reference
  encoder_lr: 3.0e-6
  decoder_lr: 3.0e-6
  bridge_lr: 5.0e-6
  cross_attention_lr: 5.0e-6
  weight_decay: 0.01
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  max_grad_norm: 3.0
  seed: 42
  num_workers: 0
  max_steps: 0
  validate_every_steps: 200        # also validates at epoch end; best.pt tracks best validation
  max_train_examples: 0
  validation_max_examples: 0
  validation_batch_size: 2
  log_every_steps: 1
  save_each_epoch: true
  save_best: true
  evaluate_before_training: false # skip the initial SFT validation pass

reward:
  # Backend / preprocessing documented in README. This training proxy is NOT
  # claimed to reproduce corpus-level Perl ROUGE-1.5.5 exactly.
  rouge1_weight: 1.0
  rouge2_weight: 2.0
  rougeL_weight: 1.0
