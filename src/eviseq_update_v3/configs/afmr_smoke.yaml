_base_: afmr_base.yaml

experiment:
  name: afmr_smoke
  output_dir: runs/eviseq_update_v3/smoke

model:
  encoder_name: __tiny__
  decoder_name: __tiny__
  dtype: float32
  gradient_checkpointing: true

architecture:
  controller_dim: 16
  depth_taps: 2
  depth_rank: 8
  feature_rank: 8
  focus_hidden: 16
  focus_windows: [4, 8, 16]

decoder:
  # Generic legacy fixtures; scripts/smoke_test.py enables the complete v3 graph.
  query_cross_gate: false
  grounded_copy:
    enabled: false
    key_dim: 8
    semantic_read:
      enabled: false
      rank: 8
      num_heads: 1
      attention: independent_source
      fusion: residual

training:
  interface_warmup_epochs: 1
  full_finetune_epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 1
  validation_batch_size: 2
  num_workers: 0
  validation_num_workers: 0

data:
  decoder_prompt: "Summarize:"
  decoder_chat_template: false
  decoder_prefix: ""
  train_file: tests/fixtures/train.jsonl
  validation_file: tests/fixtures/validation.jsonl
  test_file: tests/fixtures/test.jsonl

generation:
  batch_size: 2
  max_new_tokens: 32
  min_new_tokens: 0
