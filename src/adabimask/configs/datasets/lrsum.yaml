_base_: ../base.yaml

experiment:
  name: adabimask_qwen35_lrsum
  output_dir: runs/adabimask/lrsum

data:
  train_file: data/lrsum/train.jsonl
  validation_file: data/lrsum/validation.jsonl
  test_file: data/lrsum/test.jsonl
  source_prefix: "Tóm tắt bài báo bằng một câu nêu sự kiện chính; không thêm thông tin.\nBài báo:\n"
  target_prefix: "\nTóm tắt:\n"
  use_chat_template: true
  clean_wikihow_metadata: false
  max_source_length: 3072
  max_target_length: 256

generation:
  max_new_tokens: 192
