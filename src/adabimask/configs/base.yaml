experiment:
  name: adabimask_base
  kind: encoder_decoder
  output_dir: runs/adabimask/base

model:
  encoder_name: Qwen/Qwen3.5-0.8B
  dtype: bfloat16
  use_lora: false
  train_base: true
  gradient_checkpointing: true
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, in_proj_qkv, in_proj_z, in_proj_b, in_proj_a, out_proj, gate_proj, up_proj, down_proj]

mask:
  mode: learnable
  # Qwen3.5 has six repeated blocks of 3 DeltaNet + 1 full-attention.
  num_groups: 6
  budget_groups: 2
  fixed_strategy: middle
  selected_groups: []
  random_seed: 42
  init_probability: 0.01
  temperature: 1.0
  curriculum_ratio: 0.20
  hard_eval: true
  budget_weight: 0.05
  binary_weight: 0.01

decoder:
  pretrained_name: Qwen/Qwen3.5-0.8B
  num_layers: 16
  gradient_checkpointing: true
  cross_attention_dropout: 0.0
  dropout: 0.0
  tie_embeddings: true
  max_target_length: 384

training:
  # Epochs 1-2 warm up the new interface; epochs 3-10 full-fine-tune.
  epochs: 10
  interface_warmup_epochs: 2
  skip_interface_warmup_on_resume: true
  stop_after_interface: false
  batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 4
  encoder_lr: 8.0e-6
  adaptor_lr: 1.0e-4
  decoder_lr: 1.0e-5
  gate_lr: 5.0e-3
  warmup_ratio: 0.05
  min_lr_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  fused_optimizer: true
  seed: 42
  log_every_steps: 10

data:
  train_file: data/processed/train.jsonl
  validation_file: data/processed/validation.jsonl
  test_file: data/processed/test.jsonl
  source_prefix: "Tóm tắt thành các bước hành động ngắn, đúng thứ tự; không thêm thông tin.\nVăn bản:\n"
  target_prefix: "\nCác bước:\n"
  use_chat_template: true
  clean_wikihow_metadata: true
  max_source_length: 3072
  max_target_length: 384

generation:
  batch_size: 4
  min_new_tokens: 0
  max_new_tokens: 256
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3
