[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eviseq-kd"
version = "0.1.0"
description = "Independent online knowledge-distillation pipeline for EviSeq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=5.2,<6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
eviseq-kd = "eviseq_kd.trainer:main"
eviseq-kd-build-cache = "eviseq_kd.build_cache:main"
eviseq-kd-check-cache = "eviseq_kd.check_cache:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eviseq_kd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
