_base_: base_kd.yaml

experiment:
  name: eviseq_kd_wikilingua_qwen3_4b_teacher
  output_dir: runs/eviseq_kd/wikilingua_qwen3_4b_teacher

training:
  interface_warmup_epochs: 2
  full_finetune_epochs: 12
  distillation:
    enabled: true
    mode: online
    teacher_model: Qwen/Qwen3-4B
    cache_path: ""
    cache_split: train
    cache_max_examples: 0
    teacher_device: auto
    teacher_batch_size: 8
    teacher_max_input_length: 4096
    teacher_max_new_tokens: 384
    teacher_num_beams: 1
    sequence_enabled: true
    sequence_weight: 0.30
    logit_enabled: true
    logit_weight: 0.30
    temperature: 2.0
    logit_path_mix: 0.5
    topk: 32
    cache_logits_dtype: float16

data:
  train_file: ../datasets/wikilingua/train.jsonl
  validation_file: ../datasets/wikilingua/validation.jsonl
  test_file: ../datasets/wikilingua/test.jsonl
  use_teacher_chat_template: true

limits:
  max_train_examples: 0
  max_validation_examples: 0
  max_test_examples: 0
