project:
  name: t5gemma2_1b_1b_cnndm_full_finetune_4096
  task: summarization
  output_dir: runs/t5gemma2_1b_1b_full_cnndm_4096

huggingface:
  enabled: false
  repo_id: null
  repo_type: model
  path_in_repo: null
  push_final: false
  push_eval_outputs: false
  fail_on_error: false
  private: false

model:
  model_name_or_path: google/t5gemma-2-1b-1b
  trust_remote_code: true
  torch_dtype: float32
  eval_torch_dtype: bfloat16
  use_cache_for_eval: true

training:
  mode: full_finetune
  num_train_epochs: 6
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  optim: adamw_torch_fused
  bf16: true
  fp16: false
  require_fp32_master_weights: true
  tf32: true
  gradient_checkpointing: true
  group_by_length: true
  dataloader_num_workers: 4
  logging_steps: 10
  eval_strategy: "no"
  seed: 42

data:
  train_file: T5Gemma/data/processed/cnndm/train.jsonl
  eval_file: T5Gemma/data/processed/cnndm/validation.jsonl
  test_file: T5Gemma/data/processed/cnndm/test.jsonl
  source_prefix: "Summarize the following news article concisely. Preserve the important facts and do not add information.\nArticle:\n"
  max_source_length: 4096
  max_target_length: 256

generation:
  max_new_tokens: 192
  min_new_tokens: 8
  num_beams: 1
  do_sample: false
  early_stopping: true
  temperature: 0.0
  top_k: 0
  top_p: 1.0
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3
  eval_batch_size: 8

evaluation:
  compute_bertscore: false
  bertscore_model_type: roberta-large
