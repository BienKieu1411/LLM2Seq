project:
  name: t5gemma2_4b_4b_wikilingua_full_finetune
  task: summarization
  output_dir: runs/t5gemma2_4b_4b_full_wikilingua

huggingface:
  # HF_TOKEN is download-only. Uploads are rejected by train_full.py.
  enabled: false
  repo_id: null
  repo_type: model
  path_in_repo: null
  push_final: false
  push_eval_outputs: false
  fail_on_error: false
  private: false

model:
  model_name_or_path: google/t5gemma-2-4b-4b
  trust_remote_code: true
  # Preserve FP32 parameters/AdamW states for a controlled full-finetune
  # comparison. BF16 autocast is still used for matmuls.
  torch_dtype: float32
  eval_torch_dtype: bfloat16
  use_cache_for_eval: true

training:
  mode: full_finetune
  num_train_epochs: 6
  # T5Gemma-2-4B-4B is roughly 9B parameters in total. A physical batch of
  # one plus checkpointing is the safe single-B200 starting point at 3072
  # source tokens; accumulation preserves the effective batch of 32.
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 5.0e-6
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  optim: adamw_torch_fused
  bf16: true
  fp16: false
  require_fp32_master_weights: true
  tf32: true
  gradient_checkpointing: true
  group_by_length: true
  dataloader_num_workers: 2
  logging_steps: 10
  eval_strategy: "no"
  seed: 42

data:
  train_file: T5Gemma/data/processed/train.jsonl
  eval_file: T5Gemma/data/processed/validation.jsonl
  test_file: T5Gemma/data/processed/test.jsonl
  source_prefix: "Tóm tắt thành các bước hành động ngắn, đúng thứ tự; không thêm thông tin.\nVăn bản:\n"
  max_source_length: 3072
  max_target_length: 384

generation:
  max_new_tokens: 256
  min_new_tokens: 16
  num_beams: 1
  do_sample: false
  early_stopping: true
  temperature: 0.0
  top_k: 0
  top_p: 1.0
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3
  eval_batch_size: 1

evaluation:
  compute_bertscore: false
  bertscore_model_type: bert-base-multilingual-cased
