_base_: xov_base.yaml

experiment:
  name: xov_smoke
  output_dir: runs/xov/smoke

model:
  encoder_name: __tiny__
  decoder_name: __tiny__
  dtype: float32
  gradient_checkpointing: true

architecture:
  lexical_rank: 8
  value_gate_init: 0.10
  value_gate_max: 0.20

decoder:
  grounded_copy:
    enabled: false
    key_dim: 8

training:
  interface_warmup_epochs: 1
  full_finetune_epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 1
  validation_batch_size: 2
  num_workers: 0
  validation_num_workers: 0

data:
  decoder_prompt: "Summarize:"
  decoder_chat_template: false
  decoder_prefix: ""
  train_file: tests/fixtures/train.jsonl
  validation_file: tests/fixtures/validation.jsonl
  test_file: tests/fixtures/test.jsonl

generation:
  batch_size: 2
  max_new_tokens: 32
  min_new_tokens: 0
