experiment:
  name: llm2seq_v3_qwen3_0_6b
  output_dir: runs/llm2seq_v3/qwen3_embedding_0_6b_to_qwen3_0_6b

model:
  encoder_name: Qwen/Qwen3-Embedding-0.6B
  decoder_name: Qwen/Qwen3-0.6B
  encoder_hidden_size: 1024
  encoder_num_hidden_layers: 28
  encoder_attention_mode: auto
  encoder_attn_implementation: sdpa
  encoder_trust_remote_code: true
  # check-model verifies behavior, not only the checkpoint's config flags.
  encoder_future_context_min_relative_change: 1.0e-6
  decoder_hidden_size: 1024
  dtype: float32
  gradient_checkpointing: true

adapter:
  layer_fusion: true
  fuse_layers: [-1, -5, -9, -13]
  hidden_size: 1024
  projection_ffn_size: 2048
  projection_gate_init: 0.10
  # v3: increase from 4 to 6 bidirectional layers for stronger adapter
  num_bidirectional_layers: 6
  num_heads: 16
  ffn_size: 4096
  rope_theta: 1000000.0
  bidirectional_gate_init: 0.10
  dropout: 0.10
  use_salience: true
  salience_hidden_size: 512
  salience_gate_init: 0.10
  salience_bias_scale: 0.50

decoder:
  cross_attention_every: 1
  initialize_cross_from_self: true
  # Multi-bank variants normalize attention independently per bank and route
  # the resulting context vectors, never the raw source representations.
  memory_routing_mode: attention_output
  # v3: increase from 0.10 to 0.30 — larger initial cross-attention
  # contribution helps prevent the decoder from ignoring source memory
  cross_gate_init: 0.30
  cross_attention_dropout: 0.0

objectives:
  salience_weight: 0.10
  # Target-free prompt/source InfoNCE. The decoder representation is taken at
  # the final prompt token, before teacher forcing reveals summary tokens.
  use_contrastive: true
  use_prompt_alignment: true
  use_source_swap: true
  contrastive_weight: 0.05
  contrastive_temperature: 0.07
  contrastive_projection_size: 256
  # Blend token mean with the final/EOS representation used to pretrain
  # Qwen3-Embedding. Both views remain source-only and target-leakage-free.
  contrastive_pooling: mean_last
  # Same-target source-swap ranking directly measures source utilization.
  source_swap_weight: 0.10
  source_swap_margin: 0.20
  source_swap_temperature: 1.0
  # Choose the most semantically similar wrong source in the physical batch;
  # random/cyclic negatives are often too easy to enforce fine-grained use.
  source_swap_strategy: hard_in_batch
  # Enabled by HiRoute only. Balances mean use across decoder depth without
  # forcing each individual layer to use a uniform bank mixture.
  routing_balance_weight: 0.0
  # Linearly ramp both losses through the interface warm-up; full FT starts at 1.
  contrastive_warmup_epochs: 2
  # v3: label smoothing for cross-entropy
  label_smoothing: 0.10

training:
  # v3: reduce warmup to 2 epochs — encoder fine-tunes sooner
  interface_warmup_epochs: 2
  full_finetune_epochs: 12
  batch_size: 64
  gradient_accumulation_steps: 1
  num_workers: 4
  validation_batch_size: 64
  validation_num_workers: 2
  validation_every_epochs: 0
  # Do not evaluate every epoch, but measure source utilization at the end of
  # each phase on a fixed held-out subset. This never selects a checkpoint.
  validate_at_stage_end: true
  validation_max_examples: 256
  warmup_adapter_lr: 1.0e-4
  warmup_cross_attention_lr: 1.0e-4
  # v3: higher encoder LR (1.2e-5 vs 8e-6) — encoder is causal LLM
  # with embedding training, needs stronger adaptation for seq2seq
  full_encoder_lr: 1.2e-5
  full_decoder_lr: 1.0e-5
  full_adapter_lr: 3.0e-5
  full_cross_attention_lr: 5.0e-5
  # v3: longer warmup, higher weight decay
  warmup_ratio: 0.08
  min_lr_ratio: 0.0
  weight_decay: 0.03
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: true
  fused_optimizer: true
  seed: 42
  log_every_steps: 10

data:
  # Keep v3 self-contained: never read a sibling architecture's dataset.
  train_file: data/wikilingua/train.jsonl
  validation_file: data/wikilingua/validation.jsonl
  test_file: data/wikilingua/test.jsonl
  source_prefix: "Nhiệm vụ: Tóm tắt văn bản thành các bước ngắn, đúng thứ tự.\nVăn bản:\n"
  append_source_eos: true
  source_add_special_tokens: false
  sentence_separator: "\n"
  decoder_instruction: "Hãy tóm tắt văn bản đã mã hóa thành các bước hành động ngắn, đúng thứ tự và không thêm thông tin."
  decoder_prefix: "Các bước:\n"
  use_decoder_chat_template: true
  enable_thinking: false
  clean_wikihow_metadata: true
  max_source_length: 3072
  max_target_length: 384
  oracle_max_units: 12
  precompute_evidence: true
  precompute_validation_evidence: false

generation:
  batch_size: 64
  min_new_tokens: 16
  max_new_tokens: 256
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3

checkpoint:
  save_best: false
  save_each_epoch: false
  save_last: true

benchmark:
  # Canonical fingerprints use only id/source/target and therefore remain
  # stable if JSON key order or an unrelated metadata field changes. These
  # are the exact splits used by the full T5Gemma2-1B-1B run.
  data:
    name: WikiLingua-Vietnamese-locked
    train:
      num_examples: 13999
      sha256: dc51cdeea38be3b2f0b7c44d106da105932db0493bdad5df5d850417e8d81b9f
    validation:
      num_examples: 1680
      sha256: 6d052dbe88a50fcac825f8469cd80938252975e6a4a2a30cc44d3300227fa6de
    test:
      num_examples: 3901
      sha256: 03fba36a916a16598134d1daa211417922ff31dd294abcd0e75df7159bad3558
  parameters:
    target_name: T5Gemma2-1B-1B
    # The official model card reports 2B parameters. It is a declared,
    # rounded model size, so reports call it "2B", never an exact count.
    target_declared_parameters: 2000000000
    target_is_rounded: true
    target_source: https://huggingface.co/google/t5gemma-2-1b-1b
  # Never compare scores across these two implementations. The Python score
  # is a quick diagnostic; only the Perl score is used for the paper claim.
  diagnostic:
    name: T5Gemma2-1B-1B-full
    backend: rouge==1.0.0
    rouge1: 39.3040
    rouge2: 19.5308
    rougeL: 39.2955
    num_examples: 3901
  paper:
    name: T5Gemma2-1B-1B-full
    model_id: google/t5gemma-2-1b-1b
    backend: Perl ROUGE-1.5.5 via pyrouge
    rouge1: 62.013
    rouge2: 32.654
    rougeL: 58.143
    num_examples: 3901

limits:
  max_train_examples: 0
  max_validation_examples: 0
  max_test_examples: 0
