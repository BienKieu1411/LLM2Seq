_base_: ../qwen3_0_6b_hiroute.yaml

experiment:
  name: llm2seq_v3_ablation_pre_attention_memory_routing
  output_dir: runs/llm2seq_v3/ablations/pre_attention_memory_routing

decoder:
  # Legacy HiRoute behavior: blend banks before the attention softmax.
  memory_routing_mode: memory
  # Query-adaptive weights are only defined after bank-specific attention.
  query_adaptive_routing: false

objectives:
  # Isolate routing location; retain every other HiRoute-v3 setting.
  routing_balance_weight: 0.01
